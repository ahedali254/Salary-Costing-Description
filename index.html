<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dynamic Salary & Costing Dashboard</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.2/css/all.min.css">
    <!-- Swiper CSS for Slider Effect -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/swiper@11/swiper-bundle.min.css" />
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        body { background-color: #050b14; color: #fff; overflow-x: hidden; line-height: 1.6; display: flex; flex-direction: column; min-height: 100vh; }
        #bg-canvas { position: fixed; top: 0; left: 0; width: 100%; height: 100%; z-index: -1; background-color: #050b14; pointer-events: none; }
        
        /* Header */
        .header { 
            position: fixed; top: 0; left: 0; width: 100%; padding: 1rem 7%; 
            background: rgba(5, 11, 20, 0.95); backdrop-filter: blur(12px); 
            display: flex; justify-content: space-between; align-items: center; 
            z-index: 100; border-bottom: 1px solid rgba(0, 240, 255, 0.15); 
        }
        .logo { font-size: 1.5rem; color: #ffffff; text-decoration: none; font-weight: 700; display: inline-flex; align-items: center; gap: 0.6rem; }
        .logo-icon { font-size: 1.3rem; color: #00f0ff; filter: drop-shadow(0 0 8px rgba(0, 240, 255, 0.8)); }
        .logo-accent { background: linear-gradient(135deg, #00f0ff 0%, #7000ff 100%); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }

        /* Container */
        .dashboard-container { padding: 6.5rem 7% 3rem; max-width: 1300px; margin: 0 auto; width: 100%; flex: 1; display: flex; flex-direction: column; gap: 2rem; }
        .section-title { font-size: 1.3rem; font-weight: 700; color: #fff; margin-bottom: 1rem; display: flex; align-items: center; gap: 0.5rem; }
        .section-title i { color: #00f0ff; }

        /* Glassmorphism Cards */
        .glass-card {
            background: rgba(255, 255, 255, 0.03); border: 1px solid rgba(0, 240, 255, 0.2);
            border-radius: 16px; padding: 1.5rem; backdrop-filter: blur(10px);
            box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.37); transition: all 0.3s ease;
        }

        /* Swiper Slider Styling */
        .swiper { width: 100%; padding-bottom: 3rem !important; }
        .swiper-slide { height: auto; }
        .slide-card-header {
            font-size: 1.2rem; font-weight: 700; color: #00f0ff; 
            text-shadow: 0 0 10px rgba(0, 240, 255, 0.4); margin-bottom: 1rem;
            text-align: center; border-bottom: 1px solid rgba(0, 240, 255, 0.2); padding-bottom: 0.5rem;
        }
        
        .swiper-button-next, .swiper-button-prev { color: #00f0ff !important; }
        .swiper-pagination-bullet { background: rgba(255, 255, 255, 0.5) !important; }
        .swiper-pagination-bullet-active { background: #00f0ff !important; box-shadow: 0 0 10px #00f0ff; }

        /* Table Styling */
        .table-responsive { width: 100%; overflow-x: auto; }
        table { width: 100%; border-collapse: collapse; text-align: left; font-size: 0.95rem; }
        th { background: rgba(0, 240, 255, 0.08); color: #00f0ff; padding: 0.8rem 1rem; font-weight: 600; border-bottom: 1px solid rgba(0, 240, 255, 0.2); }
        td { padding: 0.8rem 1rem; border-bottom: 1px solid rgba(255, 255, 255, 0.05); color: #d1d5db; }
        tr:hover td { background: rgba(0, 240, 255, 0.03); color: #fff; }

        /* Sync Indicator */
        .sync-tag { font-size: 0.75rem; background: rgba(0, 240, 255, 0.1); color: #00f0ff; padding: 0.2rem 0.6rem; border-radius: 12px; border: 1px solid rgba(0, 240, 255, 0.3); margin-left: auto; }

        /* Footer */
        .footer { background: rgba(5, 11, 20, 0.95); border-top: 1px solid rgba(0, 240, 255, 0.15); padding: 1.2rem 7%; text-align: center; margin-top: auto; color: #a0aec0; font-size: 0.9rem; }
        .footer span { color: #00f0ff; }
    </style>
</head>
<body>
    <canvas id="bg-canvas"></canvas>

    <header class="header">
        <a href="#" class="logo">
            <i class="fa-solid fa-chart-line logo-icon"></i> My Financial<span class="logo-accent"> Dashboard</span>
        </a>
    </header>

    <div class="dashboard-container">
        
        <div class="glass-card">
            <div class="section-title">
                <i class="fa-solid fa-calendar-days"></i>
                সাল ও মাসওয়ারি খরচ ও আয়ের বিবরণ (Yearly Records)
                <span class="sync-tag" id="sync-status"><i class="fa-solid fa-rotate"></i> Live Sheet Connected</span>
            </div>

            <!-- Swiper Slider Container -->
            <div class="swiper mySwiper">
                <div class="swiper-wrapper" id="slider-content">
                    <!-- Dynamic Slide Tables will load here from Google Sheets -->
                </div>
                <div class="swiper-button-next"></div>
                <div class="swiper-button-prev"></div>
                <div class="swiper-pagination"></div>
            </div>
        </div>

    </div>

    <footer class="footer">
        <p>&copy; <span id="year"></span> <span>Ahad Ali Lelin</span>. All Rights Reserved.</p>
    </footer>

    <!-- Swiper JS -->
    <script src="https://cdn.jsdelivr.net/npm/swiper@11/swiper-bundle.min.js"></script>

    <script>
        document.getElementById('year').textContent = new Date().getFullYear();

        // 🔴 আপনার Google Sheet-এর Published CSV Link টি এখানে বসান
        const GOOGLE_SHEET_CSV_URL = 'YOUR_GOOGLE_SHEET_PUBLISHED_CSV_URL_HERE';

        // Google Sheet থেকে অটো ডেটা ফেচ করার ফাংশন
        async function fetchSheetData() {
            if (GOOGLE_SHEET_CSV_URL === 'YOUR_GOOGLE_SHEET_PUBLISHED_CSV_URL_HERE') {
                console.warn("Please replace GOOGLE_SHEET_CSV_URL with your actual published CSV link.");
                return;
            }

            try {
                const response = await fetch(GOOGLE_SHEET_CSV_URL + '?t=' + new Date().getTime());
                const data = await response.text();
                parseAndRenderData(data);
            } catch (error) {
                console.error("Error loading Google Sheet data:", error);
            }
        }

        // CSV ডেটা প্রসেস করে প্রতি বছরের জন্য আলাদা স্লাইড তৈরি
        function parseAndRenderData(csvText) {
            const rows = csvText.split('\n').map(row => row.split(','));
            if (rows.length < 2) return;

            const headers = rows[0]; // [Year/Month, 2023, 2024, ...]
            const sliderWrapper = document.getElementById('slider-content');
            sliderWrapper.innerHTML = ''; // Clear previous content

            // প্রতিটি বছরের জন্য স্লাইড তৈরি
            for (let col = 1; col < headers.length; col++) {
                const year = headers[col].trim();
                if (!year) continue;

                let tableRowsHtml = '';
                for (let row = 1; row < rows.length; row++) {
                    const month = rows[row][0] ? rows[row][0].trim() : '';
                    const value = rows[row][col] ? rows[row][col].trim() : '-';
                    if (month) {
                        tableRowsHtml += `
                            <tr>
                                <td>${month}</td>
                                <td style="color: #00f0ff; font-weight: 600;">${value}</td>
                            </tr>
                        `;
                    }
                }

                const slideHtml = `
                    <div class="swiper-slide">
                        <div class="glass-card">
                            <div class="slide-card-header">
                                <i class="fa-solid fa-calendar-check"></i> Year ${year}
                            </div>
                            <div class="table-responsive">
                                <table>
                                    <thead>
                                        <tr>
                                            <th>Month</th>
                                            <th>Amount (৳)</th>
                                        </tr>
                                    </thead>
                                    <tbody>
                                        ${tableRowsHtml}
                                    </tbody>
                                </table>
                            </div>
                        </div>
                    </div>
                `;
                sliderWrapper.innerHTML += slideHtml;
            }

            // Swiper Re-initialization
            initSwiper();
        }

        // Initialize Swiper Slider
        let swiperInstance = null;
        function initSwiper() {
            if (swiperInstance) swiperInstance.destroy(true, true);
            swiperInstance = new Swiper(".mySwiper", {
                slidesPerView: 1,
                spaceBetween: 20,
                loop: true,
                autoplay: {
                    delay: 4000,
                    disableOnInteraction: false,
                },
                pagination: {
                    el: ".swiper-pagination",
                    clickable: true,
                },
                navigation: {
                    nextEl: ".swiper-button-next",
                    prevEl: ".swiper-button-prev",
                },
                breakpoints: {
                    768: { slidesPerView: 2 },
                    1024: { slidesPerView: 3 }
                }
            });
        }

        // প্রথমে ডেটা লোড করবে এবং প্রতি ৫ মিনিটে ব্যাকগ্রাউন্ডে শিট সিঙ্ক করবে
        fetchSheetData();
        setInterval(fetchSheetData, 300000); // 5 Minutes Auto-Refresh

        // Background Particle Effect
        const canvas = document.getElementById('bg-canvas');
        const ctx = canvas.getContext('2d');
        let particlesArray = [];
        function resizeCanvas() { canvas.width = window.innerWidth; canvas.height = window.innerHeight; }
        resizeCanvas();
        window.addEventListener('resize', () => { resizeCanvas(); initParticles(); });

        class Particle {
            constructor() {
                this.x = Math.random() * canvas.width;
                this.y = Math.random() * canvas.height;
                this.size = Math.random() * 2 + 1;
                this.speedX = (Math.random() - 0.5) * 0.5;
                this.speedY = (Math.random() - 0.5) * 0.5;
            }
            update() {
                this.x += this.speedX; this.y += this.speedY;
                if (this.x > canvas.width) this.x = 0; if (this.x < 0) this.x = canvas.width;
                if (this.y > canvas.height) this.y = 0; if (this.y < 0) this.y = canvas.height;
            }
            draw() {
                ctx.beginPath(); ctx.arc(this.x, this.y, this.size, 0, Math.PI * 2);
                ctx.fillStyle = '#00f0ff'; ctx.fill();
            }
        }

        function initParticles() {
            particlesArray = [];
            for (let i = 0; i < 50; i++) particlesArray.push(new Particle());
        }

        function animateParticles() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            for (let i = 0; i < particlesArray.length; i++) {
                particlesArray[i].update();
                particlesArray[i].draw();
                for (let j = i; j < particlesArray.length; j++) {
                    const dx = particlesArray[i].x - particlesArray[j].x;
                    const dy = particlesArray[i].y - particlesArray[j].y;
                    const dist = Math.sqrt(dx * dx + dy * dy);
                    if (dist < 100) {
                        ctx.beginPath();
                        ctx.strokeStyle = `rgba(0, 240, 255, ${0.8 - dist/100})`;
                        ctx.lineWidth = 0.5;
                        ctx.moveTo(particlesArray[i].x, particlesArray[i].y);
                        ctx.lineTo(particlesArray[j].x, particlesArray[j].y);
                        ctx.stroke();
                    }
                }
            }
            requestAnimationFrame(animateParticles);
        }
        initParticles();
        animateParticles();
    </script>
</body>
</html>
